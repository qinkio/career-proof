name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m py_compile skills/career-proof/scripts/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate public example
        run: |
          python skills/career-proof/scripts/validate_vault.py examples/fictional-career-vault
          python skills/career-proof/scripts/audit_claims.py examples/fictional-career-vault --purpose interview
      - name: Public-repository preflight
        run: python skills/career-proof/scripts/preflight_public_repo.py .
